# Builds the Mac and Windows installers on GitHub's own machines.
# Every push runs the tests. A tag like v0.8.1 also builds both installers and
# publishes them as a GitHub Release; "Run workflow" builds them on demand
# (download under Actions > the run > Artifacts).
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests simulate FL and MIDI ports, so no MIDI library is needed here.
      - run: pip install mido==1.3.3 "numpy>=1.26,<3" "Pillow>=11.2,<13" spake2==0.9 pytest
      - run: python -m pytest -q

  mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Studio Sync.app and dmg
        run: ./Build-Mac-App.command
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Sync-Mac
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Studio Sync and Setup exe
        shell: cmd
        run: Build-Windows-Installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Sync-Windows
          path: dist/Studio-Sync-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    # Publish whatever got built, so one platform's runner trouble doesn't block the other.
    if: ${{ always() && (needs.mac.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(python3 packaging/version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Creates the vVERSION tag if it doesn't exist yet, and attaches both installers.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Studio Sync ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          body: |
            **Windows:** download `Studio-Sync-Setup-${{ steps.version.outputs.version }}.exe` and run it. On "Windows protected your PC", click More info, then Run anyway.
            **Mac (Apple silicon):** download the `.dmg`, drag Studio Sync to Applications, open it once, then System Settings > Privacy & Security > Open Anyway.
            See CHANGELOG.md for what's new.
