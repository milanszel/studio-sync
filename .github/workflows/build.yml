# Builds the Mac and Windows installers on GitHub's own machines.
# Every push runs the tests. A tag like v0.8.1 also builds both installers and
# publishes them as a GitHub Release; "Run workflow" builds them on demand
# (download under Actions > the run > Artifacts).
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mac_runner:
        description: "Mac build machine (macos-15 = Apple silicon; macos-15-intel runs on Apple silicon through Rosetta)"
        default: macos-15

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests simulate FL and MIDI ports, so no MIDI library is needed here.
      - run: pip install mido==1.3.3 "numpy>=1.26,<3" "Pillow>=11.2,<13" spake2==0.9 pytest
      - run: python -m pytest -q

  mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.inputs.mac_runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the Developer ID certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        if: env.MAC_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYPASS=$(uuidgen)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build Studio Sync.app and dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '5LUV9FY9J6' }}
        run: ./Build-Mac-App.command
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Sync-Mac
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Studio Sync and Setup exe
        shell: cmd
        run: Build-Windows-Installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Sync-Windows
          path: dist/Studio-Sync-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    # Publish whatever got built, so one platform's runner trouble doesn't block the other.
    if: ${{ always() && (needs.mac.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(python3 packaging/version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Creates the vVERSION tag if it doesn't exist yet, and attaches both installers.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Studio Sync ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          body: |
            **Windows:** download `Studio-Sync-Setup-${{ steps.version.outputs.version }}.exe` and run it. On "Windows protected your PC", click More info, then Run anyway.
            **Mac (Apple silicon):** download the `.dmg`, drag Studio Sync to Applications, open it once, then System Settings > Privacy & Security > Open Anyway.
            See CHANGELOG.md for what's new.
