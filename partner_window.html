<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#151b24;color:#edf1f7;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}header,footer{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #ffffff12}header strong{font-size:13px;font-weight:550}header span,footer{font-size:11px;color:#9ba9bc}button{background:#ffffff0a;border:1px solid #ffffff18;color:#d7e0ec;border-radius:7px;padding:6px 10px;cursor:pointer}button:hover{background:#ffffff18}button:disabled{opacity:.3;cursor:default}.controls{display:flex;gap:6px;align-items:center}output{min-width:36px;text-align:center;font-size:11px;color:#a2afc0}#viewport{flex:1;min-height:0;overflow:auto;position:relative}#frame{display:block;width:100%;height:100%;object-fit:contain}#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#9ba9bc}#empty strong{color:#dce4ef;font-size:15px}#empty p{line-height:1.6;max-width:280px;margin:0}footer{border-bottom:0;border-top:1px solid #ffffff12;flex-wrap:wrap}#key{font-size:14px;color:#e0e9f6;font-weight:550}#detail{font-size:10px;color:#93a3b8}#status:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#8893a4;margin-right:7px}#status.live:before{background:#43bc93}[hidden]{display:none!important}

body{background:radial-gradient(ellipse at 80% 0,#dfeaff,transparent 65%),#f3f5f9;color:#202736}header{background:#ffffffa8;border-bottom:1px solid #dde3ed;padding:14px 16px}header strong{font-size:14px;font-weight:600;color:#293649}button{background:#ffffffb5;border:1px solid #dce3ee;color:#526783;border-radius:8px;transition:background-color .15s}button:hover{background:#e7eef9}button:focus-visible{outline:2px solid #3983e9;outline-offset:2px}output{color:#7e8b9f}.sourcebar{padding:12px 16px}.sources{display:flex;padding:3px;gap:3px;border-radius:10px;background:#e6ebf2;border:1px solid #dce3ee}.sources button{flex:1;border:0;background:transparent;font-weight:550}.sources button.active{background:white;color:#28538a;box-shadow:0 1px 4px #203b6012}#viewport{margin:0 12px 12px;border:1px solid #dfe5ee;border-radius:12px;background:#ffffffa8}#empty{color:#8693a5}#empty strong{color:#53677f;font-weight:550}footer{background:#ffffffa8;border-top:1px solid #dde3ed;color:#7e8b9f}#key{color:#33465e}#detail{color:#8793a5}

#frame{user-select:none;-webkit-user-drag:none}#viewport{touch-action:none}#viewport.canpan{cursor:grab}#viewport.panning{cursor:grabbing}
</style></head><body><header><strong id="title">Partner View</strong><div class="controls"><button id="minus" aria-label="Zoom out">−</button><output id="percent">100%</output><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit</button></div></header><div class="sourcebar"><div class="sources" role="group" aria-label="Screen source"><button id="partner" class="active" aria-pressed="true">Partner</button><button id="mine" aria-pressed="false">My preview</button></div></div><main id="viewport"><img id="frame" hidden alt="Shared FL Studio window"><div id="empty"><strong id="emptytitle">Partner isn’t sharing yet</strong><p id="emptyhint">Ask your partner to click Share window in Partner View.</p></div></main><footer><div><span id="key">No shared key</span><div id="detail"></div></div><span id="status">Not connected</span></footer><script>
const token='__TOKEN__',$=id=>document.getElementById(id);let zoom=100,stopped=false,lastFrame=0,source="partner",latest={},lastSource="";
function setZoom(value){zoom=Math.max(100,Math.min(800,value));$('percent').textContent=zoom+'%';$('viewport').classList.toggle('canpan',zoom>100);$('minus').disabled=zoom===100;$('plus').disabled=zoom===800;$('frame').style.width=zoom+'%';$('frame').style.height=zoom===100?'100%':'auto';$('frame').style.objectFit=zoom===100?'contain':'initial';if(zoom===100){$('viewport').scrollLeft=0;$('viewport').scrollTop=0;}}
$('minus').onclick=()=>setZoom(zoom-50);$('plus').onclick=()=>setZoom(zoom+50);$('fit').onclick=()=>setZoom(100);setZoom(100);

function renderView(p){const s=p.sharing||{},mine=source==='mine',show=mine?!!s.viewing&&!!s.local_frame:!!s.frame;$('frame').hidden=!show;$('empty').hidden=show;$('title').textContent=mine?'My preview':'Partner View';$('frame').alt=mine?'Your FL Studio preview':'Partner’s FL Studio window';$('emptytitle').textContent=mine?'Preview your FL window':'Partner isn’t sharing yet';$('emptyhint').textContent=mine?(s.view_error||'Click Share window in the main app to start your preview.'):'Ask your partner to click Share window in Partner View.';if(show&&(Date.now()-lastFrame>=250||lastSource!==source)){lastFrame=Date.now();lastSource=source;$('frame').src=(mine?'/api/local-frame':'/api/frame')+'?token='+encodeURIComponent(token)+'&t='+lastFrame;}}
function selectSource(value){source=value;lastSource='';setZoom(100);for(const id of ['partner','mine']){$(id).classList.toggle('active',id===source);$(id).setAttribute('aria-pressed',String(id===source))}renderView(latest)}
$('partner').onclick=()=>selectSource('partner');$('mine').onclick=()=>selectSource('mine');

async function poll(){try{const response=await fetch('/api/state',{headers:{'X-Studio-Token':token}});if(!response.ok)throw Error();const p=await response.json(),s=p.sharing||{},peer=(p.status||{}).peer,key=(p.status||{}).peer_audio_key;latest=p;renderView(p);$('status').textContent=peer?'Partner connected':'Not connected';$('status').classList.toggle('live',!!peer);$('key').textContent=key?(key.listening?key.key:'Partner not listening'):'No shared key';$('detail').textContent=key&&key.listening?[key.strength,key.alternative].filter(Boolean).join(' · '):'';}catch(e){$('status').textContent='Connection unavailable';$('status').classList.remove('live');$('frame').hidden=true;$('empty').hidden=false;}finally{if(!stopped)setTimeout(poll,250)}}window.addEventListener('pagehide',()=>{stopped=true});poll();

const panViewport=$('viewport'),panFrame=$('frame');let panStart=null;
panFrame.draggable=false;
panViewport.addEventListener('pointerdown',e=>{if(zoom<=100||e.button!==0||panFrame.hidden)return;e.preventDefault();panStart={id:e.pointerId,x:e.clientX,y:e.clientY,left:panViewport.scrollLeft,top:panViewport.scrollTop};panViewport.setPointerCapture(e.pointerId);panViewport.classList.add('panning');});
panViewport.addEventListener('pointermove',e=>{if(!panStart||panStart.id!==e.pointerId)return;panViewport.scrollLeft=panStart.left-(e.clientX-panStart.x);panViewport.scrollTop=panStart.top-(e.clientY-panStart.y);});
function endPan(e){if(!panStart||panStart.id!==e.pointerId)return;panStart=null;panViewport.classList.remove('panning');if(panViewport.hasPointerCapture(e.pointerId))panViewport.releasePointerCapture(e.pointerId);}
for(const event of ['pointerup','pointercancel','lostpointercapture'])panViewport.addEventListener(event,endPan);

</script></body></html>
